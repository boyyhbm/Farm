[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cs2-farm-agent"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["psutil>=6.1,<8", "websockets>=14,<16", "httpx>=0.28,<1", "cryptography>=50.0.2,<51", "pywin32>=308; sys_platform == 'win32'"]
[project.scripts]
cs2-farm-agent = "agent.main:cli"
[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "collectors*", "process_manager*", "transport*", "security*"]
