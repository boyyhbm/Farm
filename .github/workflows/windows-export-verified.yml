name: Export verified Windows installers
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Original Windows build run with genuine EXEs
        required: true
        type: string
      validation_run_id:
        description: Successful complete installed application validation run
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  export-draft:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run_id }}
      VALIDATION_RUN: ${{ inputs.validation_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful completed Windows validation
        shell: pwsh
        run: |
          $Run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:VALIDATION_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Run.status -ne 'completed' -or $Run.conclusion -ne 'success' -or $Run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $Run.path -notin @('.github/workflows/windows-validate-existing.yml','.github/workflows/windows-desktop.yml')) { throw 'Complete successful trusted Windows validation required.' }
          if ($Run.path -eq '.github/workflows/windows-desktop.yml' -and $env:VALIDATION_RUN -ne $env:BUILD_RUN) { throw 'Native build validation must refer to that same build run.' }
      - uses: actions/download-artifact@v4
        with:
          name: CS2-Farm-Windows-x64
          path: artifacts/build
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: Windows-verification
          path: artifacts/verification
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run_id }}
      - name: Verify provenance, complete coverage and exact EXE hashes
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/verification/validation-provenance.json)) {
            if ($env:BUILD_RUN -ne $env:VALIDATION_RUN) { throw 'Missing verification provenance.' }
            $Run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:VALIDATION_RUN" | ConvertFrom-Json
            @{build_run=$env:BUILD_RUN; driver_commit=$Run.head_sha; os='Windows Server 2022'; clean_windows11=$false; validation='native build, installation, smoke and uninstall in same run'} | ConvertTo-Json | Set-Content artifacts/verification/validation-provenance.json -Encoding utf8
          }
          $Provenance = Get-Content artifacts/verification/validation-provenance.json -Raw | ConvertFrom-Json
          $Smoke = Get-Content artifacts/verification/installer-smoke.json -Raw | ConvertFrom-Json
          if ([string]$Provenance.build_run -ne [string]$env:BUILD_RUN -or !$Smoke.passed -or $Smoke.products -ne 'all' -or $Smoke.diagnostic_source_overlay) { throw 'Validation does not cover this build and both products.' }
          $Required = @('installed_manager_smoke','repair_install_preserves_all_database_rows','manager_relaunches_persisted_database_after_reinstall','two_real_scm_agents','manager_program_removed','agent_program_removed')
          foreach ($Name in $Required) {
            if (!($Smoke.checks | Where-Object { $_.name -eq $Name -and $_.passed })) { throw "Missing successful installed check: $Name" }
          }
          [xml]$JUnit = Get-Content artifacts/verification/windows-services.xml -Raw
          $Suite = $JUnit.testsuites.testsuite
          if ([int]$Suite.tests -ne 1 -or [int]$Suite.skipped -ne 0 -or [int]$Suite.failures -ne 0 -or [int]$Suite.errors -ne 0) { throw 'An executed successful SCM integration test is required.' }
          $Manifest = Get-Content artifacts/build/build-manifest.json -Raw | ConvertFrom-Json
          $Signatures = @{}
          foreach ($Product in @('manager','agent')) {
            $Name = if ($Product -eq 'manager') {'CS2-Farm-Manager-Setup.exe'} else {'CS2-Farm-Agent-Setup.exe'}
            if ((Get-FileHash "artifacts/build/$Product/$Name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Manifest.artifacts.$Name.sha256) { throw "EXE SHA256 mismatch: $Name" }
            $Signature = Get-AuthenticodeSignature "artifacts/build/$Product/$Name"
            $Signatures[$Name] = @{status=$Signature.Status.ToString(); signer=if ($Signature.SignerCertificate) {$Signature.SignerCertificate.Subject} else {$null}}
          }
          $Signatures | ConvertTo-Json -Depth 4 | Set-Content artifacts/verification/windows-installer-signatures.json -Encoding utf8
      - name: Create reviewable release draft with exact tested EXEs and reports
        shell: pwsh
        run: |
          $Build = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          $Tag = "windows-validated-$env:BUILD_RUN"
          $Body = @"
          Actual Windows Server 2022 validation: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:VALIDATION_RUN
          Original native build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN

          Includes exact SHA-256-verified Manager and Agent installers, installed smoke reports and two real LocalSystem agent services on one Windows host.
          Unsigned Authenticode. Clean Windows 11, physical additional PCs, actual OS reboot, interactive UAC/SmartScreen and a distinct-version schema upgrade remain unverified. See the included acceptance checklist.
          This draft does not claim a stable production release or bypass SmartScreen.
          "@
          [IO.File]::WriteAllText('artifacts/release-notes.md', $Body, [Text.UTF8Encoding]::new($false))
          $Existing = gh release view $Tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $Existing = $Existing | ConvertFrom-Json
            if (!$Existing.isDraft -or $Existing.targetCommitish -ne $Build.head_sha) { throw 'Existing release is not a matching draft.' }
          } else {
            gh release create $Tag --repo $env:GITHUB_REPOSITORY --draft --target $Build.head_sha --title 'CS2 Farm Manager 0.3.0 — Protection Windows validation' --notes-file artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release. A repository owner may pre-create the matching draft in GitHub Releases.' }
          }
          gh release upload $Tag --repo $env:GITHUB_REPOSITORY --clobber artifacts/build/manager/CS2-Farm-Manager-Setup.exe artifacts/build/agent/CS2-Farm-Agent-Setup.exe artifacts/build/build-manifest.json artifacts/verification/installer-smoke.json artifacts/verification/manager-smoke.json artifacts/verification/manager-resume.json artifacts/verification/windows-services.xml artifacts/verification/validation-provenance.json artifacts/verification/windows-installer-signatures.json docs/WINDOWS-LOCAL-CHECKLIST-RU.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          gh release view $Tag --repo $env:GITHUB_REPOSITORY --json url,assets,isDraft
